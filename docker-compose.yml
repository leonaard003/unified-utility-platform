services:
  unified-utility-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unified-utility-platform
    restart: unless-stopped
    ports:
      - "3100:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      UUP_TMP_TTL_MINUTES: 30
      UUP_MAX_UPLOAD_MB: 100
      UUP_MAX_DOWNLOAD_MB: 300
      # External provider layer. Compose reads these from a .env file sitting
      # next to this one on the server; that file is untracked, so the token
      # never reaches the repository. Leaving APIFY_TOKEN empty keeps the app
      # on the local yt-dlp pipeline exactly as before.
      APIFY_TOKEN: ${APIFY_TOKEN:-}
      APIFY_BASE_URL: ${APIFY_BASE_URL:-https://api.apify.com}
      UUP_PROVIDER_MODE: ${UUP_PROVIDER_MODE:-hybrid}
      UUP_PROVIDER_TIMEOUT_SECONDS: ${UUP_PROVIDER_TIMEOUT_SECONDS:-180}
      UUP_PROVIDER_DISABLED: ${UUP_PROVIDER_DISABLED:-}
      UUP_TRANSCRIPT_PROVIDER_PRIMARY: ${UUP_TRANSCRIPT_PROVIDER_PRIMARY:-agentx/video-transcript}
      UUP_DOWNLOAD_PROVIDER_PRIMARY: ${UUP_DOWNLOAD_PROVIDER_PRIMARY:-agentx/all-video-scraper}
      UUP_METADATA_PROVIDER_PRIMARY: ${UUP_METADATA_PROVIDER_PRIMARY:-scrapearchitect/youtube-video-formats-scraper}
    volumes:
      - unified_utility_tmp:/app/tmp
    labels:
      - traefik.enable=true
      - traefik.http.routers.unified-utility.rule=Host(`tools.aviroam.com`)
      - traefik.http.routers.unified-utility.entrypoints=websecure
      - traefik.http.routers.unified-utility.tls=true
      - traefik.http.services.unified-utility.loadbalancer.server.port=3000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  unified_utility_tmp:
